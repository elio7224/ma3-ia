<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grandMA3 AI Control</title>
<style>
:root{--bg:#141517;--bg2:#1a1b1e;--bg3:#232428;--bd:#2d2f34;--ac:#e3c07a;--ac2:#d4ad5f;--ac3:#e3c07a;--yl:#e5884f;--tx:#e7e6e2;--mu:#8c8e95;--ok:#6fbf8e;--bad:#e5645c;--sh:none;--r:6px}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body{background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;font-size:.95rem;font-weight:600}
.logo{display:none}
.badge{background:var(--yl);color:#000;font-weight:700;font-size:.66rem;padding:2px 7px;border-radius:4px}
.hr{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#st{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.chip{display:flex;align-items:center;gap:7px;font-size:.78rem;white-space:nowrap;padding:5px 8px;color:var(--mu)}
.chip.tot{font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mu);flex:none}.dot.ok{background:var(--ok)}.dot.warn{background:var(--yl)}.dot.bad{background:var(--bad)}
.btn{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;border-radius:var(--r);font-size:.8rem;cursor:pointer;transition:color .12s,background .12s}
.btn:hover{border-color:var(--mu);background:var(--bd)}.btn:disabled{opacity:.45;cursor:default}.btn:disabled:hover{background:var(--bg3);border-color:var(--bd)}
.pn .btn,.attente .btn,.bar .btn{border-color:var(--bd);color:var(--tx)}
.pn .btn:hover,.attente .btn:hover,.bar .btn:hover{background:var(--bd);border-color:var(--mu)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#17140c;font-weight:600;padding:0 22px}
.btn.pri:hover{background:var(--ac2);border-color:var(--ac2);color:#17140c}
main{flex:1;display:flex;min-height:0}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:28px 24px;display:flex;flex-direction:column;gap:20px;align-items:center}
#msgs>*{width:100%;max-width:760px}
.m{line-height:1.75;font-size:.97rem}
.m.user{align-self:center;background:var(--bg3);padding:9px 14px;border-radius:var(--r);white-space:pre-wrap;width:auto;max-width:560px;margin-left:auto;margin-right:max(0px,calc((100% - 760px)/2))}
.m.assistant{display:block;position:relative}
.av{display:none}
.md{min-width:0;color:color-mix(in srgb,var(--tx) 88%,var(--bg));max-width:700px}
.md>*+*{margin-top:16px}
.md h2,.md h3,.md h4,.md h5{line-height:1.3;margin-top:26px;font-weight:600}.md h2{font-size:1.2rem}.md h3{font-size:1.05rem;padding-bottom:6px;border-bottom:1px solid var(--bd)}.md h4,.md h5{font-size:.94rem;color:var(--ac)}.md>:first-child{margin-top:0}
.md ul,.md ol{padding-left:22px}.md li+li{margin-top:9px}.md li{padding-left:2px}.md ol{list-style:none;padding-left:0;counter-reset:etape}.md ol>li{counter-increment:etape;position:relative;padding-left:34px;min-height:24px}
.md ol>li::before{content:counter(etape);position:absolute;left:0;top:2px;width:22px;height:22px;border-radius:50%;background:var(--bg3);color:var(--ac);font-size:.78rem;font-weight:650;display:flex;align-items:center;justify-content:center;line-height:1}
.md ul>li::marker{color:var(--ac)}.md li::marker{color:var(--mu)}
.md strong{font-weight:650;color:var(--tx)}.md code{background:var(--bg3);border-radius:4px;padding:1px 6px;font:.86em Consolas,"Cascadia Mono",monospace}
.md blockquote{border-left:3px solid var(--ac);background:var(--bg2);padding:11px 15px;border-radius:0 var(--r) var(--r) 0}
.md blockquote.warn{border-left-color:var(--yl);background:color-mix(in srgb,var(--yl) 10%,var(--bg))}
.md blockquote.ok{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--bg))}
.md blockquote.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.md li>ul,.md li>ol{margin-top:8px}.md li>ul{list-style:circle}
.md>p:first-child{font-size:1rem}.md p.statut{border-left:3px solid var(--bd);padding:3px 0 3px 12px}.md p.statut+p.statut{margin-top:8px}.md p.statut.ok{border-left-color:var(--ok)}.md p.statut.bad{border-left-color:var(--bad)}.md p.statut.warn{border-left-color:var(--yl)}
.copier-rep{position:absolute;right:0;top:-6px;background:var(--bg3);color:var(--mu);border:1px solid var(--bd);border-radius:var(--r);padding:3px 9px;font-size:.72rem;cursor:pointer;opacity:0;transition:opacity .12s}
.m.assistant:hover .copier-rep,.copier-rep:focus-visible{opacity:1}.copier-rep:hover{color:var(--tx)}
.md p.intitule{font-weight:600;margin-top:24px;margin-bottom:-6px}.md p+h2,.md p+h3{margin-top:30px}
.md hr{border:0;border-top:1px solid var(--bd)}.md a{color:var(--ac)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{text-align:left;font-weight:600;color:var(--mu);background:var(--bg2);white-space:nowrap}th,td{padding:9px 14px;border-bottom:1px solid var(--bd);vertical-align:top}td{font-variant-numeric:tabular-nums}td:first-child{font-weight:600}tbody tr:hover td{background:var(--bg2)}
tr:last-child td{border-bottom:0}
.code{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;background:var(--bg2)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:.74rem;color:var(--mu);border-bottom:1px solid var(--bd)}
.copy{background:none;border:0;color:var(--mu);border-radius:4px;padding:3px 8px;font-size:.74rem;cursor:pointer}.copy:hover{color:var(--tx);background:var(--bg3)}
.code pre{padding:13px 16px;overflow-x:auto;line-height:1.6}.code code{background:none;padding:0;font-size:.84rem}
.typing{display:flex;gap:5px;padding:10px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mu);animation:b 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-left:0}
.chips button{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:7px 12px;font-size:.82rem;cursor:pointer;transition:background .12s,border-color .12s}.chips button:hover{border-color:var(--mu);background:var(--bg2)}
.bar{display:flex;gap:8px;padding:12px 24px 18px;width:100%;max-width:808px;margin:0 auto}
textarea{flex:1;resize:none;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:11px 14px;font-size:.94rem;outline:none;max-height:160px}textarea:focus{border-color:var(--ac)}
aside{width:360px;display:flex;flex-direction:column;border-left:1px solid var(--bd)}aside.hide{display:none}
aside h3{padding:12px 16px;font-size:.8rem;font-weight:600;color:var(--mu);border-bottom:1px solid var(--bd)}
#acts{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}.mu{color:var(--mu);font-size:.85rem}
details.act{border-left:2px solid var(--ok);font-size:.8rem;padding-left:2px}details.act.err{border-left-color:var(--bad)}
.act summary{cursor:pointer;padding:7px 10px;display:flex;gap:8px;align-items:center;list-style:none}.act summary::-webkit-details-marker{display:none}
.tag{color:var(--tx);font:.76rem Consolas,"Cascadia Mono",monospace;flex:none}.sum{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act pre{margin:0 10px 10px;padding:8px;background:var(--bg2);border-radius:4px;font:.75rem Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;color:var(--mu)}
select.btn{padding:6px 8px;max-width:230px;color:var(--mu)}select.btn option{background:var(--bg2);color:var(--tx)}.cost{font-size:.72rem;color:var(--mu);margin:-12px 0 0 0}
.attente{margin-left:0!important;border-radius:var(--r)!important;border-color:var(--bd)!important;background:var(--bg2)!important}
@media(max-width:900px){aside{display:none}}

[data-theme=clair]{--bg:#f7f7f5;--bg2:#ffffff;--bg3:#ecece8;--bd:#dcdcd6;--ac:#9a6b12;--ac2:#835a0c;--ac3:#9a6b12;--yl:#c2561b;--tx:#1e1f22;--mu:#6c6e75;--ok:#2f8a57;--bad:#c4372f}
[data-theme=clair] .btn.pri,[data-theme=clair] .btn.pri:hover{color:#fff}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#ov.on{display:flex}
.pn{width:min(640px,100%);max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:22px 24px}
.pn h2{font-size:1.1rem;font-weight:600;margin-bottom:4px}.pn h4{margin:20px 0 8px;font-size:.88rem;font-weight:600;color:var(--tx)}
.pn label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
.pn input,.pn select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r);padding:8px 11px;font-size:.9rem;outline:none}.pn input:focus,.pn select:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1}.row>.sm{flex:none;width:110px}.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{font-size:.82rem;margin-top:8px;min-height:1em;line-height:1.5}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.hint{font-size:.78rem;color:var(--mu);line-height:1.5;margin-top:6px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;align-items:center}.steps{font-size:.78rem;color:var(--mu)}
.pn code{background:var(--bg3);border-radius:4px;padding:1px 5px;font:.82em Consolas,"Cascadia Mono",monospace;word-break:break-all}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">MA</span><b>grandMA3 AI Control</b></div>
  <div class="hr">
    <span class="chip"><i id="dot" class="dot"></i><span id="st">Connexion…</span></span>
    <select id="modele" class="btn" title="Modèle de l'IA"><option value="haiku">Haiku 5.5 · économique</option><option value="sonnet">Sonnet 5.5 · plus puissant</option></select>
    <a class="chip" id="modeVal" href="#" style="display:none;color:var(--ac3);border-color:var(--ac);text-decoration:none"></a>
    <a class="chip" id="plugMaj" href="#" style="display:none;color:var(--yl);border-color:var(--yl);text-decoration:none"></a>
    <a class="chip" id="maj" href="#" style="display:none;color:var(--yl);border-color:var(--yl);text-decoration:none"></a>
    <span class="chip" id="ver" style="color:var(--mt,inherit)"></span>
    <span class="chip tot" id="cout" title="Coût estimé depuis le lancement de l'app, et plafond (⚙ Réglages)">Session : ≈ 0,000 $</span>
    <button id="bRescan" class="btn">Rescan</button>
    <button id="bNew" class="btn">Nouvelle conversation</button>
    <button id="bLogs" class="btn">Actions</button>
    <button id="bJournal" class="btn" title="Tout ce qui a été envoyé à la console, avec l'heure">Journal</button>
    <button id="bSet" class="btn">Réglages</button>
  </div>
</header>
<main>
  <section class="chat">
    <div id="msgs"></div>
    <div class="bar">
      <textarea id="inp" rows="1" placeholder="Écris ta demande…  (Entrée = envoyer, Maj+Entrée = nouvelle ligne)"></textarea>
      <button id="stop" class="btn" style="display:none">Stop</button>
      <button id="send" class="btn pri">Envoyer</button>
    </div>
  </section>
  <aside id="logs"><h3>Actions exécutées</h3><div id="acts"><p class="mu">Rien pour l'instant.</p></div></aside>
</main>
<div id="ov"><div class="pn" id="pn"></div></div>
<script>
const API = "/api", $ = id => document.getElementById(id);
// Langue de l'interface ("fr" ou "en"), fournie par le serveur (réglage « langue », auto = langue du système).
let LANG = "fr";
const tr = (fr, en) => LANG === "en" ? en : fr;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let hist = [], busy = false, ident = "";

/* ---------- Markdown (HTML échappé d'abord : sûr) ---------- */
function inline(t) {
  t = esc(t);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"']+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
}
function md(src) {
  const blocks = [];
  src = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => { blocks.push({ l, c: c.replace(/\n$/, "") }); return "\n\u0001" + (blocks.length - 1) + "\u0001\n"; });
  const lines = src.split("\n"), li = /^([-*•]|\d+[.)])\s+/;
  let out = "", i = 0, para = [], m;
  const flush = () => {
    if (!para.length) return;
    // Courte ligne qui finit par « : » (ex. « À vérifier : ») = intitulé de la liste qui suit.
    const intitule = para.length === 1 && para[0].trim().length <= 60 && /[:：]$/.test(para[0].trim());
    const t0 = para[0].trim();
    const statut = /^(✅|✔)/.test(t0) ? "ok" : /^(❌|✖)/.test(t0) ? "bad" : /^(⚠|⛔|🛑)/.test(t0) ? "warn" : "";
    out += (intitule ? '<p class="intitule">' : statut ? `<p class="statut ${statut}">` : "<p>") + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>"; para = [];
  };
  while (i < lines.length) {
    const L = lines[i], T = L.trim();
    if (!T) { flush(); i++; continue; }
    if ((m = T.match(/^\u0001(\d+)\u0001$/))) {
      flush(); const b = blocks[m[1]];
      out += `<div class="code"><div class="code-h"><span>${esc(b.l || tr("Commandes", "Commands"))}</span><button class="copy">${tr("Copier", "Copy")}</button></div><pre><code>${esc(b.c)}</code></pre></div>`;
      i++; continue;
    }
    if ((m = T.match(/^(#{1,4})\s+(.*)$/))) { flush(); const n = m[1].length + 1; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})$/.test(T)) { flush(); out += "<hr>"; i++; continue; }
    if (T[0] === "|" && i + 1 < lines.length && /^\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1].trim())) {
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(T); i += 2; let rows = "";
      while (i < lines.length && lines[i].trim()[0] === "|") { rows += "<tr>" + cells(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out += `<div class="tw"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }
    if (li.test(T)) {
      flush(); const ord = /^\d/.test(T); let items = "";
      // Les lignes de liste indentées (2 espaces ou plus) deviennent une sous-liste de l'item précédent.
      const est_sous = l => li.test(l.trim()) && /^\s{2,}\S/.test(l);
      while (i < lines.length && li.test(lines[i].trim()) && !est_sous(lines[i])) {
        let sous = ""; const txt = inline(lines[i].trim().replace(li, "")); i++;
        while (i < lines.length && est_sous(lines[i])) { sous += "<li>" + inline(lines[i].trim().replace(li, "")) + "</li>"; i++; }
        items += "<li>" + txt + (sous ? `<ul>${sous}</ul>` : "") + "</li>";
      }
      out += ord ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue;
    }
    if (T[0] === ">") {
      flush(); const q = [];
      while (i < lines.length && lines[i].trim()[0] === ">") { q.push(lines[i].trim().replace(/^>\s?/, "")); i++; }
      const kind = /^(⚠|⛔|🛑)/.test(q[0]) ? "warn" : /^(✅|✔)/.test(q[0]) ? "ok" : /^(❌|✖)/.test(q[0]) ? "bad" : "";
      out += `<blockquote class="${kind}">` + inline(q.join("\n")).replace(/\n/g, "<br>") + "</blockquote>"; continue;
    }
    if (/^(✅|✔|❌|✖|⚠|⛔|🛑)/.test(T)) { flush(); para.push(L); flush(); i++; continue; }   // une ligne de statut = son propre bloc
    para.push(L); i++;
  }
  flush(); return out;
}

/* ---------- Interface ---------- */
const scroll = () => { const c = $("msgs"); c.scrollTop = c.scrollHeight; };
function addMsg(role, text) {
  const d = document.createElement("div"); d.className = "m " + role;
  if (role === "assistant") d.innerHTML = '<div class="av">AI</div><div class="md">' + md(String(text).replace(/\n*\[ACTIONS\][\s\S]*?(\[\/ACTIONS\]|$)/, "")) + "</div>";
  else d.textContent = text;
  if (role === "assistant") {
    const b = document.createElement("button"); b.className = "copier-rep"; b.textContent = tr("Copier", "Copy");
    b.onclick = () => { navigator.clipboard.writeText(d.querySelector(".md").innerText).then(() => { b.textContent = tr("Copié", "Copied"); setTimeout(() => b.textContent = tr("Copier", "Copy"), 1500); }).catch(() => {}); };
    d.appendChild(b);
  }
  $("msgs").appendChild(d); scroll(); return d;
}
function typing() {
  const d = document.createElement("div"); d.className = "m assistant";
  d.innerHTML = '<div class="av">AI</div><div class="md"><div class="typing"><i></i><i></i><i></i></div></div>';
  $("msgs").appendChild(d); scroll(); return d;
}
function addAct(a) {
  const box = $("acts"); const p = box.querySelector("p.mu"); if (p) p.remove();
  const d = document.createElement("details"); d.className = "act" + (a.error ? " err" : "");
  const res = String(a.result || "");
  d.innerHTML = `<summary><span class="tag">${esc(a.name)}</span><span class="sum">${esc(res.slice(0, 80))}</span></summary>` +
    (Object.keys(a.input || {}).length ? `<pre>${esc(JSON.stringify(a.input, null, 2))}</pre>` : "") + `<pre>${esc(res)}</pre>`;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
let session = null, alerteVue = false;
const nb = n => (n || 0).toLocaleString(LANG === "en" ? "en-US" : "fr-FR");
const usd = (n, d = 2) => LANG === "en" ? (n || 0).toFixed(d) : (n || 0).toFixed(d).replace(".", ",");
// Coût de la session (calculé par le serveur depuis le lancement) + alerte à 80 % du plafond.
function majCout(s) {
  if (s) session = s;
  if (!session) return;
  const c = $("cout");
  c.textContent = tr("Session : ≈ ", "Session: ≈ ") + usd(session.cout_usd, 3) + " $" + (session.plafond_usd > 0 ? " / " + usd(session.plafond_usd) + " $" : "");
  c.style.color = session.atteint ? "var(--bad)" : session.alerte ? "var(--yl)" : "";
  if (session.alerte && !session.atteint && !alerteVue) {
    alerteVue = true;
    addMsg("assistant", tr(`⚠️ **Attention : ${usd(session.cout_usd)} $ dépensés sur ${usd(session.plafond_usd)} $ de plafond pour cette session.** Les demandes seront bloquées au plafond (modifiable dans ⚙ Réglages).`,
      `⚠️ **Warning: ${usd(session.cout_usd)} $ spent out of a ${usd(session.plafond_usd)} $ limit for this session.** Requests will be blocked at the limit (change it in ⚙ Settings).`));
  }
  if (!session.alerte) alerteVue = false;
}
function addCout(u) {
  const entree = (u.input || 0) + (u.cache_read || 0) + (u.cache_write || 0);
  const d = document.createElement("div"); d.className = "cost";
  d.textContent = tr(`${u.modele} · ${nb(entree)} tokens en entrée (dont ${nb(u.cache_read)} en cache) · ${nb(u.output)} en sortie · ≈ ${usd(u.cout_usd, 4)} $`,
    `${u.modele} · ${nb(entree)} input tokens (${nb(u.cache_read)} cached) · ${nb(u.output)} output · ≈ ${usd(u.cout_usd, 4)} $`);
  $("msgs").appendChild(d); scroll();
}
// Mode validation : carte listant les commandes préparées, avec Envoyer / Annuler.
function carteAttente(a) {
  const d = document.createElement("div"); d.className = "attente";
  d.style.cssText = "margin:-4px 0 0 44px;border:1px solid var(--ac);border-radius:12px;padding:12px 14px;background:var(--bg2)";

// Lit le flux NDJSON de /api/chat/flux : affiche chaque action dès qu'elle est faite, renvoie le résultat final.
async function lireFlux(r, t) {
  const lecteur = r.body.getReader(), dec = new TextDecoder(); let tampon = "", final = null;
  while (true) {
    const { done, value } = await lecteur.read();
    if (done) break;
    tampon += dec.decode(value, { stream: true });
    let i;
    while ((i = tampon.indexOf("\n")) >= 0) {
      const ligne = tampon.slice(0, i).trim(); tampon = tampon.slice(i + 1);
      if (!ligne) continue;
      const ev = JSON.parse(ligne);
      if (ev.type === "action") addAct(ev.action);
      else if (ev.type === "tour") {
        let s = t.querySelector("small");
        if (!s) { s = document.createElement("small"); s.className = "mu"; t.querySelector(".md").appendChild(s); }
        s.textContent = tr(` tour ${ev.n}/${ev.max}`, ` round ${ev.n}/${ev.max}`);
      }
      else if (ev.type === "final") final = ev.data;
      else if (ev.type === "erreur") throw new Error(ev.message);
    }
  }
  return final;
}
async function send(txt) {

    ident = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    $("stop").style.display = ""; $("stop").disabled = false; $("stop").textContent = "Stop";
    const r = await fetch(API + "/chat/flux", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: hist, modele: $("modele").value, ident }) });
    if (!r.ok) throw new Error("HTTP " + r.status);

    refresh();

    const d = await J("/reglages/cle", "POST", { cle: $("cleIn").value.trim() });
    say("cleMsg", d.ok, d.message);
    if (d.ok) { $("cleIn").value = ""; R.cle = d.cle; $("cleEtat").innerHTML = etatCle(d.cle); refresh(); }
  };
  const del = $("bDelCle");
  if (del) del.onclick = async () => { if (!confirm(tr(`Supprimer la clé du ${COFFRE()} ?`, `Delete the key from ${COFFRE()}?`))) return; const d = await J("/reglages/cle", "DELETE"); R.cle = d.cle; reglages(); };
}
function lierOsc() {
  $("bTestOsc").onclick = async () => { const d = await J("/reglages/tester-osc", "POST", { hote: $("oscH").value, port: $("oscP").value }); say("oscMsg", d.ok, d.message); };
}
const sauver = (extra = {}) => J("/reglages", "POST", { reglages: { osc_hote: $("oscH").value, osc_port: $("oscP").value, ...extra } });

async function reglages() {
  R = await J("/reglages"); const r = R.reglages;
  const opts = Object.entries(R.modeles).map(([k, n]) => `<option value="${k}"${k === r.modele_defaut ? " selected" : ""}>${esc(n)}</option>`).join("");
  ouvrir(`<h2>${tr("Réglages", "Settings")}</h2><div class="hint">${tr("Enregistrés dans", "Saved in")} <code>${esc(R.fichier)}</code></div>
  <h4>${tr("Intelligence artificielle", "Artificial intelligence")}</h4>${blocCle()}
  <label>${tr("Modèle par défaut", "Default model")}</label><select id="mod">${opts}</select>
  <label>${tr("Tours d'outils maximum par demande", "Maximum tool rounds per request")}</label><input id="tours" type="number" min="1" max="100" value="${r.max_tours_outils}">
  <label>${tr("Plafond de dépense par session, en $ (0 = aucun plafond)", "Spending limit per session, in $ (0 = no limit)")}</label><input id="plaf" type="number" min="0" max="1000" step="0.5" value="${r.plafond_session_usd}">
  <div class="hint">${tr(`Dépensé depuis le lancement : ≈ ${usd(session ? session.cout_usd : 0, 3)} $. Alerte à 80 %, nouvelles demandes bloquées au plafond.`, `Spent since launch: ≈ ${usd(session ? session.cout_usd : 0, 3)} $. Warning at 80%, new requests blocked at the limit.`)}</div>
  <div class="acts2"><button class="btn" id="bRaz">${tr("Remettre le compteur à zéro", "Reset the counter")}</button></div><div class="msg" id="cMsg"></div>
  <h4>${tr("Console grandMA3", "grandMA3 console")}</h4>${blocOsc()}
  <label>${tr("Mode validation (je valide avant l'envoi)", "Approval mode (I approve before sending)")}</label><select id="valid"><option value="false"${r.validation_manuelle ? "" : " selected"}>${tr("Désactivé : l'IA envoie directement", "Off: the AI sends directly")}</option><option value="true"${r.validation_manuelle ? " selected" : ""}>${tr("Activé : je vérifie puis je clique sur Envoyer", "On: I check, then click Send")}</option></select>
  <div class="hint">${tr("Activé, l'IA prépare les commandes (macros, commandes, générations…) sans les envoyer : elles s'affichent dans le chat avec « Envoyer » et « Annuler ». Idéal en répétition. La lecture du show n'est pas concernée.",
    "When on, the AI prepares the commands (macros, commands, generations…) without sending them: they show in the chat with \"Send\" and \"Cancel\". Ideal in rehearsal. Reading the show is not affected.")}</div>
  <label>${tr("Sauvegarde automatique avant les actions de masse", "Automatic backup before bulk actions")}</label><select id="sauv"><option value="true"${r.sauvegarde_auto ? " selected" : ""}>${tr("Activée", "On")}</option><option value="false"${r.sauvegarde_auto ? "" : " selected"}>${tr("Désactivée", "Off")}</option></select>
  <div class="hint">${tr("Avant de générer des macros ou d'agir sur une plage (Delete / Store / Copy / Move … Thru …), l'app envoie <code>SaveShow</code> : grandMA3 garde une copie datée dans Backup Shows (Menu › Backup › Load). 2 minutes minimum entre deux sauvegardes.",
    "Before generating macros or acting on a range (Delete / Store / Copy / Move … Thru …), the app sends <code>SaveShow</code>: grandMA3 keeps a dated copy in Backup Shows (Menu › Backup › Load). At least 2 minutes between two backups.")}</div>
  <label>${tr("Dossier gma3_library", "gma3_library folder")}</label><input id="bib" value="${esc(r.dossier_bibliotheque)}">
  <div class="acts2"><button class="btn" id="bPlug">${tr("Vérifier le plugin AI_Index", "Check the AI_Index plugin")}</button></div><div class="hint" id="plugEtat">${blocPlugin(R.plugin)}</div>${blocInstallPlugin(false)}
  <h4>${tr("Apparence et données", "Appearance and data")}</h4>
  ${blocLangue(r.langue)}
  <label>${tr("Prévenir quand une nouvelle version sort", "Tell me when a new version is out")}</label><select id="vmaj"><option value="true"${r.verifier_mises_a_jour ? " selected" : ""}>${tr("Oui", "Yes")}</option><option value="false"${r.verifier_mises_a_jour ? "" : " selected"}>${tr("Non", "No")}</option></select>
  <div class="hint">${tr("Au lancement, l'app regarde la dernière version publiée sur GitHub (aucune donnée envoyée).", "On launch, the app checks the latest version published on GitHub (no data sent).")}</div>
  <label>${tr("Thème", "Theme")}</label><select id="thm"><option value="sombre"${r.theme === "sombre" ? " selected" : ""}>${tr("Sombre", "Dark")}</option><option value="clair"${r.theme === "clair" ? " selected" : ""}>${tr("Clair", "Light")}</option></select>
  <div class="acts2"><button class="btn" id="bHist">${tr("🗑 Effacer l'historique du chat", "🗑 Clear chat history")}</button><button class="btn" id="bWiz">${tr("🧭 Relancer l'assistant", "🧭 Restart the setup wizard")}</button></div><div class="msg" id="gMsg"></div>
  <div class="foot"><span></span><div class="acts2" style="margin:0"><button class="btn" id="bClose">${tr("Fermer", "Close")}</button><button class="btn pri" style="padding:8px 22px" id="bSave">${tr("Enregistrer", "Save")}</button></div></div>`);
  lierCle(); lierOsc();
  lierPlugin(); lierInstall();
  $("bHist").onclick = async () => { if (!confirm(tr("Effacer tout l'historique du chat ?", "Clear the whole chat history?"))) return; await fetch(API + "/history", { method: "DELETE" }); hist = []; $("msgs").innerHTML = ""; welcome(); say("gMsg", true, tr("Historique effacé.", "History cleared.")); };
  $("bWiz").onclick = assistant; $("bClose").onclick = fermer;
  $("bRaz").onclick = async () => { majCout(await J("/session/reinitialiser", "POST")); say("cMsg", true, tr("Compteur remis à zéro.", "Counter reset.")); };
  $("bSave").onclick = async () => {
    const avant = r.langue;
    const d = await sauver({ modele_defaut: $("mod").value, max_tours_outils: $("tours").value, plafond_session_usd: $("plaf").value, sauvegarde_auto: $("sauv").value === "true", validation_manuelle: $("valid").value === "true", verifier_mises_a_jour: $("vmaj").value === "true", dossier_bibliotheque: $("bib").value, theme: $("thm").value, langue: $("lng").value });
    if (!d.ok) return say("gMsg", false, Object.values(d.erreurs).join(" "));
    if (d.reglages.langue !== avant) return location.reload();   // nouvelle langue : on recharge toute l'interface
    applyTheme(d.reglages.theme); $("modele").value = d.reglages.modele_defaut;
    try { localStorage.setItem("modele", d.reglages.modele_defaut); } catch (e) {}
    say("gMsg", true, tr("Réglages enregistrés.", "Settings saved.")); refresh();
  };
}
async function assistant() {
  R = await J("/reglages"); let n = 0;
  const ETAPES = [tr("Clé API", "API key"), tr("Console", "Console"), tr("Plugin d'index", "Index plugin")];
  const rendre = () => {
    const corps = [
      blocLangue(R.reglages.langue) + `<div class="hint">${tr("Bienvenue ! Cette application pilote ta console grandMA3 avec une IA. Commençons par ta clé API Anthropic (à créer sur console.anthropic.com).", "Welcome! This application controls your grandMA3 console with AI. Let's start with your Anthropic API key (create one at console.anthropic.com).")}</div>` + blocCle(),
      `<div class="hint">${tr("Indique où se trouve ta console. Si grandMA3 onPC tourne sur cet ordinateur, garde les valeurs par défaut.", "Tell the app where your console is. If grandMA3 onPC runs on this computer, keep the default values.")}</div>` + blocOsc(),
      `<div class="hint">${tr("Le plugin <code>AI_Index</code> permet à l'IA de lire ton showfile.", "The <code>AI_Index</code> plugin lets the AI read your showfile.")}</div><label>${tr("Dossier gma3_library", "gma3_library folder")}</label><input id="bib" value="${esc(R.reglages.dossier_bibliotheque)}"><div class="acts2"><button class="btn" id="bPlug">${tr("Vérifier", "Check")}</button></div><div class="hint" id="plugEtat">${blocPlugin(R.plugin)}</div>${blocInstallPlugin(true)}`][n];
    ouvrir(`<h2>${tr("🧭 Premier lancement", "🧭 First launch")} — ${ETAPES[n]}</h2><div class="steps">${tr(`Étape ${n + 1} sur 3`, `Step ${n + 1} of 3`)}</div>${corps}
    <div class="foot"><button class="btn" id="bSkip">${n ? tr("← Retour", "← Back") : tr("Passer", "Skip")}</button><button class="btn pri" style="padding:8px 22px" id="bNext">${n < 2 ? tr("Suivant →", "Next →") : tr("Terminer", "Finish")}</button></div>`);
    if (n === 0) {
      lierCle();
      // Changer la langue ici l'enregistre et réaffiche l'assistant dans la nouvelle langue.
      $("lng").onchange = async () => { const d = await J("/reglages", "POST", { reglages: { langue: $("lng").value } }); if (d.ok) { R = await J("/reglages"); LANG = R.langue; textesFixes(); rendre(); } };
    }
    if (n === 1) lierOsc();
    if (n === 2) { lierPlugin(); lierInstall(); }
    $("bSkip").onclick = () => n ? (n--, rendre()) : (J("/reglages", "POST", { reglages: { premier_lancement_fait: true } }), fermer());
    $("bNext").onclick = async () => {
      if (n === 1) { const d = await sauver(); if (!d.ok) return say("oscMsg", false, Object.values(d.erreurs).join(" ")); R.reglages = d.reglages; }
      if (n === 2) { const d = await J("/reglages", "POST", { reglages: { dossier_bibliotheque: $("bib").value, premier_lancement_fait: true } }); if (!d.ok) { $("plugEtat").innerHTML = `<div class="msg bad">${esc(Object.values(d.erreurs).join(" "))}</div>`; return; } fermer(); refresh(); return; }
      n++; rendre();
    };
  };
  rendre();
}
// Lien externe : navigateur par défaut dans l'app de bureau, nouvel onglet sinon.
function ouvrirLien(url) {
  try { if (window.pywebview?.api?.ouvrir_lien) return window.pywebview.api.ouvrir_lien(url); } catch (e) {}
  window.open(url, "_blank", "noopener");
}
async function verifierVersion() {
  try {
    const v = await J("/version");
    $("ver").textContent = "v" + v.actuelle;
    $("ver").title = tr(`Version de MA3-IA installée : ${v.actuelle}`, `Installed MA3-IA version: ${v.actuelle}`);
    if (!v.nouvelle) return;
    const a = $("maj");
    a.textContent = tr(`⬆ Version ${v.derniere} disponible`, `⬆ Version ${v.derniere} available`);
    a.title = tr(`Tu as la ${v.actuelle}. Clique pour ouvrir la page de téléchargement.`, `You have ${v.actuelle}. Click to open the download page.`);
    a.onclick = e => { e.preventDefault(); ouvrirLien(v.url); };
    a.style.display = "";
  } catch (e) {}
}
function blocLangue(choix) {
  const o = (v, t) => `<option value="${v}"${choix === v ? " selected" : ""}>${t}</option>`;
  return `<label>${tr("Langue / Language", "Language / Langue")}</label><select id="lng">${o("auto", tr("Automatique (langue du système)", "Automatic (system language)"))}${o("fr", "Français")}${o("en", "English")}</select>`;
}
// Textes écrits en dur dans le HTML : réécrits dans la langue choisie.
function textesFixes() {
  document.documentElement.lang = LANG;
  $("modele").title = tr("Modèle de l'IA", "AI model");
  $("modele").options[0].textContent = tr("Haiku 5.5 · économique", "Haiku 5.5 · economical");
  $("modele").options[1].textContent = tr("Sonnet 5.5 · plus puissant", "Sonnet 5.5 · more powerful");
  $("cout").title = tr("Coût estimé depuis le lancement de l'app, et plafond (⚙ Réglages)", "Estimated cost since the app was launched, and limit (⚙ Settings)");
  $("bNew").textContent = tr("Nouveau chat", "New chat");
  $("bNew").title = tr("Nouvelle conversation (efface le chat et la mémoire de l'IA)", "New conversation (clears the chat and the AI's memory)");
  $("bLogs").textContent = "Actions";
  $("bJournal").textContent = tr("Journal", "Log");
  $("bJournal").title = tr("Tout ce qui a été envoyé à la console, avec l'heure", "Everything sent to the console, with the time");
  $("bSet").textContent = tr("Réglages", "Settings");
  $("inp").placeholder = tr("Écris ta demande…  (Entrée = envoyer, Maj+Entrée = nouvelle ligne)", "Type your request…  (Enter = send, Shift+Enter = new line)");
  $("send").textContent = tr("Envoyer", "Send");
  document.querySelector("#logs h3").textContent = tr("Actions exécutées", "Executed actions");
  const vide = document.querySelector("#acts p.mu"); if (vide) vide.textContent = tr("Rien pour l'instant.", "Nothing yet.");
  if (session) majCout();
}
$("bSet").onclick = reglages;
$("ov").addEventListener("mousedown", e => { if (e.target === $("ov")) fermer(); });

(async () => {
  try { R = await J("/reglages"); LANG = R.langue === "en" ? "en" : "fr"; } catch (e) {}
  textesFixes();
  try {
    const d = await (await fetch(API + "/history")).json();
    hist = d.messages || [];
    hist.forEach(m => { if (typeof m.content === "string") addMsg(m.role, m.content.replace(/\n*\[ACTIONS\][\s\S]*?\[\/ACTIONS\]/, "")); });
  } catch (e) {}
  if (!hist.length) welcome();
  try { localStorage.removeItem("coutSession"); } catch (e) {}   // ancien compteur, remplacé par celui du serveur
  refresh();
  verifierVersion();
  try {
    if (!R) R = await J("/reglages");
    applyTheme(R.reglages.theme);
    if (!localStorage.getItem("modele")) $("modele").value = R.reglages.modele_defaut;
    if (!R.reglages.premier_lancement_fait) assistant();
  } catch (e) {}
})();
</script>
</body>
</html>
