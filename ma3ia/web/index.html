<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grandMA3 AI Control</title>
<style>
:root{--bg:#0b0d14;--bg2:#121520;--bg3:#1a1e2c;--bd:#272c3d;--ac:#8b5cf6;--ac2:#7c3aed;--ac3:#a78bfa;--yl:#f59e0b;--tx:#e8eaf0;--mu:#8b93a7;--ok:#22c55e;--bad:#ef4444;--sh:0 8px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,"Segoe UI",sans-serif}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
body{background:radial-gradient(900px 500px at 12% -10%,rgba(124,58,237,.16),transparent 60%),radial-gradient(700px 420px at 100% 0,rgba(59,130,246,.09),transparent 60%),var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 22px;background:rgba(18,21,32,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);z-index:2}
.brand{display:flex;align-items:center;gap:10px;font-size:1.05rem;letter-spacing:.01em}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--ac),#3b82f6);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff;box-shadow:0 0 18px rgba(139,92,246,.45)}
.brand b{background:linear-gradient(90deg,#fff,var(--ac3));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{background:var(--yl);color:#000;font-weight:800;font-size:.66rem;padding:2px 7px;border-radius:5px}
.hr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;font-size:.78rem;background:var(--bg3);border:1px solid var(--bd);padding:6px 13px;border-radius:20px;color:var(--mu);transition:.2s}
.chip.tot{color:var(--tx);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu);flex:none}.dot.ok{background:var(--ok);box-shadow:0 0 9px var(--ok)}.dot.warn{background:var(--yl);box-shadow:0 0 9px var(--yl)}.dot.bad{background:var(--bad);box-shadow:0 0 9px var(--bad)}
.btn{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);padding:7px 13px;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--ac);transform:translateY(-1px)}.btn:active{transform:none}.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));border-color:transparent;color:#fff;padding:0 24px;box-shadow:0 4px 16px rgba(124,58,237,.35)}
main{flex:1;display:flex;min-height:0}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
#msgs{flex:1;overflow-y:auto;padding:26px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.m{max-width:900px;line-height:1.6;font-size:.94rem;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.m.user{align-self:flex-end;background:linear-gradient(135deg,var(--ac2),#6d4bd8);padding:10px 16px;border-radius:16px 16px 4px 16px;white-space:pre-wrap;max-width:70%;box-shadow:0 4px 18px rgba(124,58,237,.25)}
.m.assistant{align-self:flex-start;display:flex;gap:12px;width:100%}
.av{flex:none;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--bd);display:grid;place-items:center;font-size:.66rem;font-weight:800;color:var(--ac3)}
.md{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--bd);border-radius:4px 16px 16px 16px;padding:15px 20px;box-shadow:var(--sh)}
.md>*+*{margin-top:10px}
.md h2,.md h3,.md h4,.md h5{color:#fff;line-height:1.3;margin-top:16px}.md h2{font-size:1.15rem}.md h3{font-size:1.04rem;color:var(--ac3)}.md h4,.md h5{font-size:.95rem}
.md ul,.md ol{padding-left:22px}.md li+li{margin-top:4px}.md li::marker{color:var(--ac)}
.md code{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font:.85em Consolas,monospace;color:#c4b5fd}
.md blockquote{border-left:3px solid var(--yl);padding-left:12px;color:var(--mu)}
.md hr{border:0;border-top:1px solid var(--bd)}.md a{color:#93c5fd}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{background:var(--bg3);text-align:left;color:#fff}th,td{padding:7px 12px;border-bottom:1px solid var(--bd)}
tbody tr:nth-child(even){background:rgba(255,255,255,.025)}tr:last-child td{border-bottom:0}
.code{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--bg)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--bg3);font-size:.7rem;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.copy{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:6px;padding:2px 9px;font-size:.72rem;cursor:pointer;transition:.15s}.copy:hover{color:#fff;border-color:var(--ac)}
.code pre{padding:12px 14px;overflow-x:auto}.code code{background:none;border:0;padding:0;color:#e2e8f0;font-size:.84rem}
.typing{display:flex;gap:5px;padding:14px 4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:b 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:44px}
.chips button{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:8px 15px;font-size:.82rem;cursor:pointer;transition:.15s}.chips button:hover{border-color:var(--ac);color:#fff;transform:translateY(-1px);box-shadow:0 4px 14px rgba(124,58,237,.2)}
.bar{display:flex;gap:10px;padding:14px 22px 18px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
textarea{flex:1;resize:none;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;font-size:.94rem;outline:none;max-height:160px;transition:.15s;box-shadow:var(--sh)}textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(139,92,246,.18)}
aside{width:380px;display:flex;flex-direction:column;background:rgba(11,16,32,.7);border-left:1px solid var(--bd)}aside.hide{display:none}
aside h3{padding:13px 16px;font-size:.76rem;color:var(--mu);background:var(--bg2);border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.08em}
#acts{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.mu{color:var(--mu);font-size:.85rem}
details.act{background:var(--bg2);border:1px solid var(--bd);border-left:3px solid var(--ok);border-radius:10px;font-size:.8rem;animation:in .25s ease both}details.act.err{border-left-color:var(--bad)}
.act summary{cursor:pointer;padding:9px 11px;display:flex;gap:8px;align-items:center;list-style:none}.act summary::-webkit-details-marker{display:none}
.tag{background:var(--bg3);color:#c4b5fd;border-radius:5px;padding:1px 7px;font:.75rem Consolas,monospace;flex:none}.sum{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act pre{margin:0 10px 10px;padding:8px;background:var(--bg);border-radius:7px;font:.75rem Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;color:#cbd5e1}
select.btn{padding:7px 10px;max-width:230px}.cost{font-size:.72rem;color:var(--mu);margin:-8px 0 0 44px}
@media(max-width:900px){aside{display:none}}

[data-theme=clair]{--bg:#f4f5fa;--bg2:#ffffff;--bg3:#eceef6;--bd:#d6d9e6;--tx:#1b1e2b;--mu:#667085;--sh:0 6px 20px rgba(30,30,60,.12)}
[data-theme=clair] .md h2,[data-theme=clair] .md h3,[data-theme=clair] th{color:#1b1e2b}[data-theme=clair] .md h3{color:var(--ac2)}[data-theme=clair] .md code{color:var(--ac2)}[data-theme=clair] .code code{color:#1b1e2b}
#ov{position:fixed;inset:0;background:rgba(5,6,12,.62);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}#ov.on{display:flex}
.pn{width:min(640px,100%);max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:22px 24px;animation:in .25s ease both}
.pn h2{font-size:1.15rem;margin-bottom:4px}.pn h4{margin:18px 0 8px;font-size:.78rem;color:var(--ac3);text-transform:uppercase;letter-spacing:.08em}
.pn label{display:block;font-size:.8rem;color:var(--mu);margin:10px 0 4px}
.pn input,.pn select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;font-size:.9rem;outline:none}.pn input:focus,.pn select:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:flex-end}.row>*{flex:1}.row>.sm{flex:none;width:110px}.acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{font-size:.82rem;margin-top:8px;min-height:1em;line-height:1.5}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.hint{font-size:.78rem;color:var(--mu);line-height:1.5;margin-top:6px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;align-items:center}.steps{font-size:.75rem;color:var(--mu)}
.pn code{background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font:.82em Consolas,monospace;word-break:break-all}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">MA</span><b>grandMA3 AI Control</b></div>
  <div class="hr">
    <span class="chip"><i id="dot" class="dot"></i><span id="st">Connexion…</span></span>
    <select id="modele" class="btn" title="Modèle de l'IA"><option value="haiku">Haiku 5.5 · économique</option><option value="sonnet">Sonnet 5.5 · plus puissant</option></select>
    <span class="chip tot" id="cout" title="Coût estimé depuis le lancement de l'app, et plafond (⚙ Réglages)">Session : ≈ 0,000 $</span>
    <button id="bRescan" class="btn">🔄 Rescan</button>
    <button id="bNew" class="btn">🗑 Nouvelle conversation</button>
    <button id="bLogs" class="btn">📋 Actions</button>
    <button id="bJournal" class="btn" title="Tout ce qui a été envoyé à la console, avec l'heure">📜 Journal</button>
    <button id="bSet" class="btn">⚙ Réglages</button>
  </div>
</header>
<main>
  <section class="chat">
    <div id="msgs"></div>
    <div class="bar">
      <textarea id="inp" rows="1" placeholder="Écris ta demande…  (Entrée = envoyer, Maj+Entrée = nouvelle ligne)"></textarea>
      <button id="send" class="btn pri">Envoyer</button>
    </div>
  </section>
  <aside id="logs"><h3>Actions exécutées</h3><div id="acts"><p class="mu">Rien pour l'instant.</p></div></aside>
</main>
<div id="ov"><div class="pn" id="pn"></div></div>
<script>
const API = "/api", $ = id => document.getElementById(id);
// Langue de l'interface ("fr" ou "en"), fournie par le serveur (réglage « langue », auto = langue de Windows).
let LANG = "fr";
const tr = (fr, en) => LANG === "en" ? en : fr;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
let hist = [], busy = false;

/* ---------- Markdown (HTML échappé d'abord : sûr) ---------- */
function inline(t) {
  t = esc(t);
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)"']+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
}
function md(src) {
  const blocks = [];
  src = String(src).replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, c) => { blocks.push({ l, c: c.replace(/\n$/, "") }); return "\n\u0001" + (blocks.length - 1) + "\u0001\n"; });
  const lines = src.split("\n"), li = /^([-*•]|\d+[.)])\s+/;
  let out = "", i = 0, para = [], m;
  const flush = () => { if (para.length) { out += "<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>"; para = []; } };
  while (i < lines.length) {
    const L = lines[i], T = L.trim();
    if (!T) { flush(); i++; continue; }
    if ((m = T.match(/^\u0001(\d+)\u0001$/))) {
      flush(); const b = blocks[m[1]];
      out += `<div class="code"><div class="code-h"><span>${esc(b.l || "code")}</span><button class="copy">${tr("Copier", "Copy")}</button></div><pre><code>${esc(b.c)}</code></pre></div>`;
      i++; continue;
    }
    if ((m = T.match(/^(#{1,4})\s+(.*)$/))) { flush(); const n = m[1].length + 1; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^(-{3,}|\*{3,})$/.test(T)) { flush(); out += "<hr>"; i++; continue; }
    if (T[0] === "|" && i + 1 < lines.length && /^\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1].trim())) {
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(T); i += 2; let rows = "";
      while (i < lines.length && lines[i].trim()[0] === "|") { rows += "<tr>" + cells(lines[i]).map(c => `<td>${c}</td>`).join("") + "</tr>"; i++; }
      out += `<div class="tw"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      continue;
    }
    if (li.test(T)) {
      flush(); const ord = /^\d/.test(T); let items = "";
      while (i < lines.length && li.test(lines[i].trim())) { items += "<li>" + inline(lines[i].trim().replace(li, "")) + "</li>"; i++; }
      out += ord ? `<ol>${items}</ol>` : `<ul>${items}</ul>`; continue;
    }
    if (T[0] === ">") { flush(); out += "<blockquote>" + inline(T.replace(/^>\s?/, "")) + "</blockquote>"; i++; continue; }
    para.push(L); i++;
  }
  flush(); return out;
}

/* ---------- Interface ---------- */
const scroll = () => { const c = $("msgs"); c.scrollTop = c.scrollHeight; };
function addMsg(role, text) {
  const d = document.createElement("div"); d.className = "m " + role;
  if (role === "assistant") d.innerHTML = '<div class="av">AI</div><div class="md">' + md(text) + "</div>";
  else d.textContent = text;
  $("msgs").appendChild(d); scroll(); return d;
}
function typing() {
  const d = document.createElement("div"); d.className = "m assistant";
  d.innerHTML = '<div class="av">AI</div><div class="md"><div class="typing"><i></i><i></i><i></i></div></div>';
  $("msgs").appendChild(d); scroll(); return d;
}
function addAct(a) {
  const box = $("acts"); const p = box.querySelector("p.mu"); if (p) p.remove();
  const d = document.createElement("details"); d.className = "act" + (a.error ? " err" : "");
  const res = String(a.result || "");
  d.innerHTML = `<summary><span class="tag">${esc(a.name)}</span><span class="sum">${esc(res.slice(0, 80))}</span></summary>` +
    (Object.keys(a.input || {}).length ? `<pre>${esc(JSON.stringify(a.input, null, 2))}</pre>` : "") + `<pre>${esc(res)}</pre>`;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
let session = null, alerteVue = false;
const nb = n => (n || 0).toLocaleString(LANG === "en" ? "en-US" : "fr-FR");
const usd = (n, d = 2) => LANG === "en" ? (n || 0).toFixed(d) : (n || 0).toFixed(d).replace(".", ",");
// Coût de la session (calculé par le serveur depuis le lancement) + alerte à 80 % du plafond.
function majCout(s) {
  if (s) session = s;
  if (!session) return;
  const c = $("cout");
  c.textContent = tr("Session : ≈ ", "Session: ≈ ") + usd(session.cout_usd, 3) + " $" + (session.plafond_usd > 0 ? " / " + usd(session.plafond_usd) + " $" : "");
  c.style.color = session.atteint ? "var(--bad)" : session.alerte ? "var(--yl)" : "";
  if (session.alerte && !session.atteint && !alerteVue) {
    alerteVue = true;
    addMsg("assistant", tr(`⚠️ **Attention : ${usd(session.cout_usd)} $ dépensés sur ${usd(session.plafond_usd)} $ de plafond pour cette session.** Les demandes seront bloquées au plafond (modifiable dans ⚙ Réglages).`,
      `⚠️ **Warning: ${usd(session.cout_usd)} $ spent out of a ${usd(session.plafond_usd)} $ limit for this session.** Requests will be blocked at the limit (change it in ⚙ Settings).`));
  }
  if (!session.alerte) alerteVue = false;
}
function addCout(u) {
  const entree = (u.input || 0) + (u.cache_read || 0) + (u.cache_write || 0);
  const d = document.createElement("div"); d.className = "cost";
  d.textContent = tr(`${u.modele} · ${nb(entree)} tokens en entrée (dont ${nb(u.cache_read)} en cache) · ${nb(u.output)} en sortie · ≈ ${usd(u.cout_usd, 4)} $`,
    `${u.modele} · ${nb(entree)} input tokens (${nb(u.cache_read)} cached) · ${nb(u.output)} output · ≈ ${usd(u.cout_usd, 4)} $`);
  $("msgs").appendChild(d); scroll();
}
function welcome() {
  addMsg("assistant", tr("## Bonjour 👋\nL'agent grandMA3 est prêt. Voici quelques idées pour commencer :",
    "## Hello 👋\nThe grandMA3 agent is ready. Here are a few ideas to get started:"));
  const c = document.createElement("div"); c.className = "chips";
  (LANG === "en" ? ["List my macros (number and name)", "What is in my index?", "Read macro 2002 and summarise it"]
    : ["Liste mes macros (numéro et nom)", "Que contient mon index ?", "Lis la macro 2002 et résume-la"]).forEach(t => {
    const b = document.createElement("button"); b.textContent = t; b.onclick = () => send(t); c.appendChild(b);
  });
  $("msgs").appendChild(c);
}
async function refresh() {
  try {
    const d = await (await fetch(API + "/status")).json();
    const noms = LANG === "en" ? {} : { groups: "groupes", sequences: "séquences" };
    const parts = Object.entries(d.counts || {}).filter(([, n]) => n > 0).map(([k, n]) => `${n} ${noms[k] || k}`);
    $("st").textContent = parts.length ? tr("Index : ", "Index: ") + parts.join(" · ") : tr("Index vide : plugin AI_Index ? (puis Rescan)", "Empty index: AI_Index plugin? (then Rescan)");
    $("dot").className = "dot " + (parts.length ? "ok" : "warn");
    if (d.session) majCout(d.session);
  } catch (e) { $("st").textContent = tr("Serveur injoignable", "Server unreachable"); $("dot").className = "dot bad"; }
}
async function send(txt) {
  txt = (txt ?? $("inp").value).trim();
  if (!txt || busy) return;
  busy = true; $("send").disabled = true; $("inp").value = ""; fit();
  addMsg("user", txt); hist.push({ role: "user", content: txt });
  const t = typing();
  try {
    const r = await fetch(API + "/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: hist, modele: $("modele").value }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json(); t.remove();
    if (d.messages) hist = d.messages;
    addMsg("assistant", d.response || tr("(réponse vide)", "(empty response)"));
    if (d.usage) addCout(d.usage);
    if (d.session) majCout(d.session);
    if (d.actions && d.actions.length) d.actions.forEach(addAct);
    else (d.logs || []).forEach(l => addAct({ name: "log", input: {}, result: l, error: l.startsWith("⚠️") }));
    refresh();
  } catch (e) {
    t.remove(); hist.pop();
    addMsg("assistant", tr("⚠️ Connexion impossible avec le serveur : ", "⚠️ Cannot reach the server: ") + e.message + tr(". Redémarre l'application.", ". Restart the application."));
  }
  busy = false; $("send").disabled = false; $("inp").focus();
}
const fit = () => { const i = $("inp"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 160) + "px"; };

$("send").onclick = () => send();
$("inp").addEventListener("input", fit);
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("bLogs").onclick = () => $("logs").classList.toggle("hide");
const dateFr = iso => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(LANG === "en" ? "en-GB" : "fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }); };
// Les sources sont enregistrées en français dans le journal : traduites à l'affichage.
const SOURCES_EN = { "Scan au démarrage": "Startup scan", "Test de connexion": "Connection test" };
const sourceTxt = s => LANG === "en" ? (SOURCES_EN[s] || String(s).replace(/^IA · /, "AI · ")) : s;
async function journalOuvrir() {
  let d;
  try { d = await J("/journal?limite=500"); } catch (e) { d = { entrees: [], fichier: "?" }; }

function blocLangue(choix) {
  const o = (v, t) => `<option value="${v}"${choix === v ? " selected" : ""}>${t}</option>`;
  return `<label>${tr("Langue / Language", "Language / Langue")}</label><select id="lng">${o("auto", tr("Automatique (langue de Windows)", "Automatic (Windows language)"))}${o("fr", "Français")}${o("en", "English")}</select>`;
}
// Textes écrits en dur dans le HTML : réécrits dans la langue choisie.
function textesFixes() {
  document.documentElement.lang = LANG;
  $("modele").title = tr("Modèle de l'IA", "AI model");
  $("modele").options[0].textContent = tr("Haiku 5.5 · économique", "Haiku 5.5 · economical");
  $("modele").options[1].textContent = tr("Sonnet 5.5 · plus puissant", "Sonnet 5.5 · more powerful");
  $("cout").title = tr("Coût estimé depuis le lancement de l'app, et plafond (⚙ Réglages)", "Estimated cost since the app was launched, and limit (⚙ Settings)");
  $("bNew").textContent = tr("🗑 Nouveau chat", "🗑 New chat");
  $("bNew").title = tr("Nouvelle conversation (efface le chat et la mémoire de l'IA)", "New conversation (clears the chat and the AI's memory)");
  $("bLogs").textContent = "📋 Actions";
  $("bJournal").textContent = tr("📜 Journal", "📜 Log");
  $("bJournal").title = tr("Tout ce qui a été envoyé à la console, avec l'heure", "Everything sent to the console, with the time");
  $("bSet").textContent = tr("⚙ Réglages", "⚙ Settings");
  $("inp").placeholder = tr("Écris ta demande…  (Entrée = envoyer, Maj+Entrée = nouvelle ligne)", "Type your request…  (Enter = send, Shift+Enter = new line)");
  $("send").textContent = tr("Envoyer", "Send");
  document.querySelector("#logs h3").textContent = tr("Actions exécutées", "Executed actions");
  const vide = document.querySelector("#acts p.mu"); if (vide) vide.textContent = tr("Rien pour l'instant.", "Nothing yet.");
  if (session) majCout();
}
$("bSet").onclick = reglages;
$("ov").addEventListener("mousedown", e => { if (e.target === $("ov")) fermer(); });

(async () => {
  try { R = await J("/reglages"); LANG = R.langue === "en" ? "en" : "fr"; } catch (e) {}
  textesFixes();
  try {
    const d = await (await fetch(API + "/history")).json();
    hist = d.messages || [];
    hist.forEach(m => { if (typeof m.content === "string") addMsg(m.role, m.content); });
  } catch (e) {}
  if (!hist.length) welcome();
  try { localStorage.removeItem("coutSession"); } catch (e) {}   // ancien compteur, remplacé par celui du serveur
  refresh();
  try {
    if (!R) R = await J("/reglages");
    applyTheme(R.reglages.theme);
    if (!localStorage.getItem("modele")) $("modele").value = R.reglages.modele_defaut;
    if (!R.reglages.premier_lancement_fait) assistant();
  } catch (e) {}
})();
</script>
</body>
</html>
