# Construit l'installateur sur les serveurs de GitHub et le publie dans une Release.
# Déclenché en poussant un tag de version :  git tag v1.0.0 && git push origin v1.0.0
# Intérêt : n'importe qui peut voir exactement comment le fichier téléchargé a été construit (code source + journal).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # créer la Release
  id-token: write        # attestation de provenance
  attestations: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Le tag correspond à version.py
        shell: bash
        run: |
          v=$(python -c "from version import VERSION; print(VERSION)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} différent de version.py ($v)"; exit 1; }

      - name: Tests
        run: |
          python -m pip install -q -r requirements-build.txt
          python -m pytest -q tests

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construction (application + installateur)
        shell: cmd
        run: construire_exe.bat silencieux

      - name: Empreinte SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist\MA3-IA-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      # Attestation de provenance (preuve signée que le fichier vient de ce workflow) : dépôts publics uniquement.
      - name: Attestation de provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/MA3-IA-Setup-*.exe

      - name: Release GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/MA3-IA-Setup-*.exe dist/SHA256SUMS.txt \
            --title "MA3-IA ${GITHUB_REF_NAME}" --notes-file installeur/notes_release.md
