# Tests sur Windows et macOS à chaque push et pull request (sans console ni vraie API).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install -q -r requirements-build.txt
          python -m pytest -q tests
