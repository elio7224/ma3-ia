# Tests sur Windows à chaque push et pull request (sans console ni vraie API).
# macOS n'est testé qu'à la main (Actions > Tests > Run workflow) : ses runners sont souvent saturés et annulent le job.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest","macos-latest"]' || '["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install -q -r requirements-build.txt
          python -m pytest -q tests
